# ============================================
# STARSHIP PROMPT — MINIMAL
# ============================================

add_newline = false
right_format = "$cmd_duration"

format = "$directory$git_branch$git_status$character"

# ---------------------------
# PROMPT CHARACTER
# ---------------------------
[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vicmd_symbol   = "[❮](bold yellow)"

# ---------------------------
# DIRECTORY
# ---------------------------
[directory]
truncation_length = 2
truncate_to_repo  = true
format            = "[$path]($style) "
style             = "bold cyan"
read_only         = " 🔒"
read_only_style   = "red"
truncation_symbol = "…/"

[directory.substitutions]
"Code" = "💻 "

# ---------------------------
# GIT BRANCH
# ---------------------------
[git_branch]
symbol            = " "
format            = "[$symbol$branch]($style) "
style             = "bold green"
truncation_length = 20
truncation_symbol = "…"

# ---------------------------
# GIT STATUS
# ---------------------------
[git_status]
format     = "([$all_status$ahead_behind]($style) )"
style      = "yellow"
up_to_date = ""
conflicted = "⚠️ "
untracked  = "?"
modified   = "⚡"
staged     = "●"
renamed    = "»"
deleted    = "✖"
ahead      = "↑${count}"
behind     = "↓${count}"
diverged   = "↑${ahead_count}↓${behind_count}"
stashed    = "▪"

# ---------------------------
# EXECUTION TIME (RIGHT)
# ---------------------------
[cmd_duration]
min_time          = 5_000
format            = "[$duration]($style)"
style             = "dimmed yellow"
show_milliseconds = false
disabled          = false

# ---------------------------
# DISABLED
# ---------------------------
[time]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[golang]
disabled = true

[package]
disabled = true

[docker_context]
disabled = true

[git_commit]
disabled = true
